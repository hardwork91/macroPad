<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macropad Config</title>
<style>
  :root {
    --bg-1: #3a3d42;
    --bg-2: #1c1e22;
    --pad-bg: #0c0d0f;
    --key-bg-1: #17181b;
    --key-bg-2: #0a0b0d;
    --key-border: #2a2c31;
    --panel-bg: #141518;
    --panel-border: #26282d;
    --text: #e8e9ec;
    --text-dim: #8b8e96;
    --text-faint: #55585f;
    --accent: #7c8cf8;
    --radius: 14px;
    --mono: "Cascadia Code", "SF Mono", "Consolas", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-1), var(--bg-2) 70%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  header p {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* ---------- Macropad ---------- */
  .pad {
    background: linear-gradient(160deg, #17181c, var(--pad-bg) 60%);
    border: 1px solid #212227;
    border-radius: 22px;
    padding: 26px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.65),
      0 10px 24px -8px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.04);
  }

  .grid {
    --key-size: clamp(42px, 8.5vw, 74px);
    display: grid;
    grid-template-columns: repeat(8, var(--key-size));
    grid-template-rows: repeat(2, var(--key-size));
    gap: clamp(8px, 1.5vw, 14px);
  }

  .key {
    position: relative;
    border-radius: var(--radius);
    background: linear-gradient(170deg, var(--key-bg-1), var(--key-bg-2));
    border: 1px solid var(--key-border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .1s ease, border-color .15s ease, box-shadow .2s ease;
    user-select: none;
    box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .key:hover { border-color: #3b3e45; transform: translateY(-2px); }
  .key:active { transform: translateY(1px); }
  .key.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 6px 14px rgba(0,0,0,.5);
  }

  .key .num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    position: absolute;
    top: 7px;
    left: 9px;
  }

  .key .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #26282d;
    transition: background .2s, box-shadow .2s;
  }
  .key.lit .led { box-shadow: 0 0 8px 2px var(--led), 0 0 2px var(--led); background: var(--led); }
  .key.lit { box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 -10px 18px -12px var(--led); }
  .key.lit.selected { box-shadow: 0 0 0 1px var(--accent), inset 0 -10px 18px -12px var(--led); }

  .key .label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-dim);
    max-width: 62px;
    text-align: center;
    line-height: 1.25;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* ---------- Panel de configuración ---------- */
  .panel {
    margin-top: 36px;
    width: 100%;
    max-width: 720px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 28px 32px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.5);
    display: none;
    animation: slideUp .25s ease;
  }
  .panel.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel-empty {
    margin-top: 36px;
    color: var(--text-faint);
    font-size: 13px;
    letter-spacing: .04em;
  }
  .panel-empty.hidden { display: none; }

  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel h2 .chip {
    background: #1e2025;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 3px 10px;
    font-family: var(--mono);
    color: var(--text);
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
  }

  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .row label {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 72px;
  }

  .shortcut-display {
    flex: 1;
    min-width: 180px;
    background: #0e0f12;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 11px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    min-height: 42px;
    display: flex;
    align-items: center;
  }
  .shortcut-display .placeholder { color: var(--text-faint); }

  kbd {
    background: #1e2025;
    border: 1px solid #33363d;
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 2px 8px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .plus {
    color: var(--text-dim);
    font-family: var(--mono);
    margin: 0 7px;
    user-select: none;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: #1c1e23;
    color: var(--text);
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #24262c; border-color: #383b42; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #101116;
    font-weight: 600;
  }
  button.primary:hover { background: #93a0fa; }
  button.ghost { background: transparent; }
  button.ghost:hover { background: #1c1e23; }
  button.danger:hover { border-color: #a34; color: #f88; }

  /* ---------- Colores LED ---------- */
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .1s, border-color .15s, box-shadow .15s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.selected { border-color: #fff; box-shadow: 0 0 10px 1px var(--sw); }
  .swatch.off {
    background: #1a1c20 !important;
    border: 2px solid #33363d;
    position: relative;
  }
  .swatch.off::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-top: 2px solid #55585f;
    transform: rotate(-45deg);
    transform-origin: center;
  }
  input[type="color"] {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: 2px dashed #4a4d55; }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 6px;
  }

  /* ---------- Modal de captura ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 11, .75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .overlay.visible { display: flex; }

  .modal {
    background: linear-gradient(170deg, #1a1c20, #101114);
    border: 1px solid #2c2e34;
    border-radius: 20px;
    padding: 40px 48px;
    width: min(440px, 90vw);
    text-align: center;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.8);
    animation: slideUp .2s ease;
  }

  .modal .pulse {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    margin: 0 auto 20px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124,140,248,.5); }
    50% { box-shadow: 0 0 0 14px rgba(124,140,248,0); }
  }

  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .modal .hint { font-size: 12.5px; color: var(--text-dim); margin-bottom: 26px; }

  .modal .capture-view {
    background: #0c0d10;
    border: 1px solid #26282d;
    border-radius: 12px;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    margin-bottom: 26px;
    font-family: var(--mono);
    font-size: 15px;
  }
  .modal .capture-view .placeholder {
    color: var(--text-faint);
    font-size: 13px;
    font-family: inherit;
  }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: center; }

  footer {
    margin-top: auto;
    padding-top: 48px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: .05em;
  }
</style>
</head>
<body>

<header>
  <h1>Macropad · 16 Keys</h1>
  <p>Select a key to configure its action and LED color</p>
</header>

<div class="pad">
  <div class="grid" id="grid"></div>
</div>

<p class="panel-empty" id="panelEmpty">— no key selected —</p>

<section class="panel" id="panel">
  <h2>Configuration <span class="chip" id="keyChip">K01</span></h2>

  <div class="row">
    <label>Action</label>
    <div class="shortcut-display" id="shortcutDisplay">
      <span class="placeholder">Not assigned</span>
    </div>
    <button id="btnCapture">⌨ Capture</button>
  </div>

  <div class="row">
    <label>LED Color</label>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="actions">
    <button class="ghost danger" id="btnClear">Clear</button>
    <button class="ghost" id="btnClose">Close</button>
    <button class="primary" id="btnSave">Save</button>
  </div>
</section>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="pulse"></div>
    <h3>Listening…</h3>
    <p class="hint">Press a key combination or shortcut</p>
    <div class="capture-view" id="captureView">
      <span class="placeholder">waiting for input…</span>
    </div>
    <div class="modal-actions">
      <button class="ghost danger" id="modalClear">Clear</button>
      <button class="ghost" id="modalCancel">Cancel</button>
      <button class="primary" id="modalAccept">Accept</button>
    </div>
  </div>
</div>

<footer>MACROPAD PROTO · v0.1</footer>

<script>
(() => {
  const NUM_KEYS = 16;
  const STORAGE_KEY = "macropad-config-v1";
  const PRESET_COLORS = ["#ff4757", "#ffa502", "#ffe066", "#2ed573", "#17d3c4", "#3b82f6", "#7c8cf8", "#c56cf0", "#ff6b9d", "#ffffff"];

  // ---- Estado ----
  let config = loadConfig();          // { [idx]: { shortcut, color } }
  let selectedKey = null;             // índice de tecla seleccionada
  let draft = null;                   // copia editable de la config de la tecla
  let capturedCombo = null;           // combo capturado en el modal

  function loadConfig() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch { return {}; }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch {}
  }

  // ---- Render del teclado ----
  const grid = document.getElementById("grid");
  for (let i = 0; i < NUM_KEYS; i++) {
    const key = document.createElement("div");
    key.className = "key";
    key.dataset.idx = i;
    key.innerHTML = `
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="led"></span>
      <span class="label"></span>`;
    key.addEventListener("click", () => selectKey(i));
    grid.appendChild(key);
  }

  function refreshKeys() {
    document.querySelectorAll(".key").forEach(el => {
      const i = +el.dataset.idx;
      const cfg = config[i];
      el.classList.toggle("selected", i === selectedKey);
      const lit = cfg && cfg.color;
      el.classList.toggle("lit", !!lit);
      el.style.setProperty("--led", lit ? cfg.color : "transparent");
      el.querySelector(".label").textContent = cfg && cfg.shortcut ? cfg.shortcut : "";
    });
  }

  // ---- Panel ----
  const panel = document.getElementById("panel");
  const panelEmpty = document.getElementById("panelEmpty");
  const keyChip = document.getElementById("keyChip");
  const shortcutDisplay = document.getElementById("shortcutDisplay");
  const swatchesEl = document.getElementById("swatches");

  function selectKey(i) {
    selectedKey = i;
    draft = Object.assign({ shortcut: null, color: null }, config[i]);
    keyChip.textContent = "K" + String(i + 1).padStart(2, "0");
    renderShortcut();
    renderSwatches();
    panel.classList.add("visible");
    panelEmpty.classList.add("hidden");
    refreshKeys();
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function renderShortcut() {
    if (draft.shortcut) {
      shortcutDisplay.innerHTML = comboHTML(draft.shortcut);
    } else {
      shortcutDisplay.innerHTML = '<span class="placeholder">Not assigned</span>';
    }
  }

  function renderSwatches() {
    swatchesEl.innerHTML = "";

    // opción "apagado"
    const off = document.createElement("div");
    off.className = "swatch off" + (!draft.color ? " selected" : "");
    off.title = "LED off";
    off.addEventListener("click", () => { draft.color = null; renderSwatches(); });
    swatchesEl.appendChild(off);

    PRESET_COLORS.forEach(c => {
      const sw = document.createElement("div");
      sw.className = "swatch" + (draft.color === c ? " selected" : "");
      sw.style.background = c;
      sw.style.setProperty("--sw", c);
      sw.addEventListener("click", () => { draft.color = c; renderSwatches(); });
      swatchesEl.appendChild(sw);
    });

    // color personalizado
    const custom = document.createElement("input");
    custom.type = "color";
    custom.title = "Custom color";
    custom.value = draft.color && !PRESET_COLORS.includes(draft.color) ? draft.color : "#888888";
    custom.addEventListener("input", e => { draft.color = e.target.value; renderSwatches(); });
    swatchesEl.appendChild(custom);
  }

  document.getElementById("btnSave").addEventListener("click", () => {
    if (draft.shortcut || draft.color) {
      config[selectedKey] = { shortcut: draft.shortcut, color: draft.color };
    } else {
      delete config[selectedKey];
    }
    persist();
    closePanel();
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    draft = { shortcut: null, color: null };
    renderShortcut();
    renderSwatches();
  });

  document.getElementById("btnClose").addEventListener("click", closePanel);

  function closePanel() {
    selectedKey = null;
    draft = null;
    panel.classList.remove("visible");
    panelEmpty.classList.remove("hidden");
    refreshKeys();
  }

  // ---- Modal de captura ----
  const overlay = document.getElementById("overlay");
  const captureView = document.getElementById("captureView");
  let listening = false;

  document.getElementById("btnCapture").addEventListener("click", () => {
    capturedCombo = null;
    captureView.innerHTML = '<span class="placeholder">waiting for input…</span>';
    overlay.classList.add("visible");
    listening = true;
  });

  function comboFromEvent(e) {
    const parts = [];
    if (e.ctrlKey) parts.push("Ctrl");
    if (e.altKey) parts.push("Alt");
    if (e.shiftKey) parts.push("Shift");
    if (e.metaKey) parts.push("Win");

    const k = e.key;
    if (!["Control", "Alt", "Shift", "Meta"].includes(k)) {
      let name = k;
      if (k === " ") name = "Space";
      else if (k.length === 1) name = k.toUpperCase();
      parts.push(name);
    }
    return parts.length ? parts.join(" + ") : null;
  }

  function comboHTML(combo) {
    return combo
      .split(" + ")
      .map(p => `<kbd>${p}</kbd>`)
      .join('<span class="plus">+</span>');
  }

  window.addEventListener("keydown", e => {
    if (!listening) return;
    e.preventDefault();
    e.stopPropagation();
    const combo = comboFromEvent(e);
    if (combo) {
      capturedCombo = combo;
      captureView.innerHTML = comboHTML(combo);
    }
  }, true);

  document.getElementById("modalAccept").addEventListener("click", () => {
    if (capturedCombo) {
      draft.shortcut = capturedCombo;
      renderShortcut();
    }
    closeModal();
  });
  document.getElementById("modalClear").addEventListener("click", () => {
    capturedCombo = null;
    captureView.innerHTML = '<span class="placeholder">waiting for input…</span>';
  });
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

  function closeModal() {
    listening = false;
    overlay.classList.remove("visible");
  }

  refreshKeys();
})();
</script>
</body>
</html>
